<!--
  Značka aplikace: štít se zlatým lemem a míč, odvozené z klubového znaku
  SK Prosek. Stejný tvar jako komponenta ClubMark, ale ve čtvercovém výřezu
  a se zesílenými tahy — na šestnácti pixelech by původní vlásečnice zmizely.

  Barvy jsou zapsané napevno, protože do samostatného souboru nedosáhnou
  tokeny z styles.css. Odpovídají brand-800, gold-500 a gold-300.
-->
